name: Modern cross-platform

concurrency:
  group: modern-cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "modern/**"
      - "Installer/bots/**"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/modern-cross-platform.yml"
  pull_request:
    paths:
      - "modern/**"
      - "Installer/bots/**"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/modern-cross-platform.yml"

jobs:
  verify-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test Rust workspace
        run: cargo test --release --workspace --no-fail-fast
      - name: Test desktop core
        run: dotnet test modern/desktop/tests/Darwinbots.Desktop.Core.Tests/Darwinbots.Desktop.Core.Tests.csproj -c Release
      - name: Test rendered desktop controls
        timeout-minutes: 30
        env:
          DARWINBOTS_GUI_AUDIT_DIR: ${{ github.workspace }}/artifacts/gui-audit/${{ matrix.rid }}
        run: dotnet test modern/desktop/tests/Darwinbots.Desktop.Tests/Darwinbots.Desktop.Tests.csproj -c Release --blame-hang-timeout 10m --blame-hang-dump-type none --logger "trx;LogFileName=rendered-controls.trx" --results-directory artifacts/test-results/${{ matrix.rid }}
      - name: Preserve rendered control receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwinbots-gui-audit-${{ matrix.rid }}
          path: |
            artifacts/gui-audit/${{ matrix.rid }}
            artifacts/test-results/${{ matrix.rid }}
          if-no-files-found: ignore
      - name: Publish desktop package
        run: dotnet publish modern/desktop/src/Darwinbots.Desktop/Darwinbots.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o artifacts/${{ matrix.rid }}
      - name: Smoke test published desktop package
        shell: pwsh
        run: |
          $package = Join-Path $PWD "artifacts/${{ matrix.rid }}"
          $name = if ($env:RUNNER_OS -eq "Windows") { "Darwinbots.Desktop.exe" } else { "Darwinbots.Desktop" }
          $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $package $name))
          $start.ArgumentList.Add("--smoke-test")
          $start.WorkingDirectory = $package
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [Diagnostics.Process]::new()
          $process.StartInfo = $start
          try {
            if (!$process.Start()) { throw "Published package did not start." }
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (!$process.WaitForExit(120000)) {
              $process.Kill($true)
              $process.WaitForExit()
              throw "Published package smoke timed out."
            }
            $resultText = $stdout.GetAwaiter().GetResult()
            $errorText = $stderr.GetAwaiter().GetResult()
            Write-Output $resultText
            if ($errorText) { Write-Output $errorText }
            if ($process.ExitCode -ne 0) { throw "Published package smoke exited $($process.ExitCode)." }
            $result = $resultText | ConvertFrom-Json -ErrorAction Stop
            if ($result.status -ne "passed" -or $result.backend -ne "CPU" -or
                $result.movement -ne $true -or $result.save_resume -ne $true -or
                $result.persistent_save_bytes_equal -ne $true -or
                $result.inspection_history_boundary -ne $true -or
                $result.species_settings -ne $true -or $result.bundled_bots -ne 48) {
              throw "Published package did not report every smoke contract."
            }
          } finally {
            $process.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: darwinbots-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
