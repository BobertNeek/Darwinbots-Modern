name: Modern cross-platform

concurrency:
  group: modern-cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "modern/**"
      - "Installer/bots/**"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/modern-cross-platform.yml"
  pull_request:
    paths:
      - "modern/**"
      - "Installer/bots/**"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/modern-cross-platform.yml"

jobs:
  verify-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test Rust workspace
        id: rust_workspace
        env:
          DARWINBOTS_GPU_FFI_TRACE: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: cargo test --release --workspace --no-fail-fast
      - name: Diagnose Windows GPU FFI test failures
        if: ${{ failure() && runner.os == 'Windows' && steps.rust_workspace.outcome == 'failure' }}
        timeout-minutes: 5
        shell: pwsh
        env:
          DARWINBOTS_GPU_FFI_TRACE: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $build = cargo test --release -p darwinbots-engine --test gpu_ffi --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testBinary = $build | ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object { $_.reason -eq "compiler-artifact" -and $_.target.name -eq "gpu_ffi" -and $_.executable } |
              Select-Object -Last 1 -ExpandProperty executable
          if (!$testBinary) { throw "Cargo did not report the GPU FFI test executable." }

          $cases = @(& $testBinary --list --format terse | ForEach-Object {
              if ($_ -match '^(.+): test$') { $Matches[1] }
          })
          if ($LASTEXITCODE -ne 0 -or $cases.Count -eq 0) { throw "Unable to list GPU FFI cases." }

          $failedCases = @()
          foreach ($case in $cases) {
              Write-Host "::group::Isolated GPU FFI case $case"
              & $testBinary --exact $case --test-threads=1 --nocapture
              $exitCode = $LASTEXITCODE
              Write-Host ("GPU FFI case {0} exited with 0x{1:X8}" -f $case, $exitCode)
              Write-Host "::endgroup::"
              if ($exitCode -ne 0) { $failedCases += $case }
          }
          if ($failedCases.Count -ne 0) { throw ("Isolated GPU FFI failures: " + ($failedCases -join ", ")) }
          Write-Host "All isolated GPU FFI invocations succeeded. Review the parallel-run case trace."
      - name: Test desktop core
        run: dotnet test modern/desktop/tests/Darwinbots.Desktop.Core.Tests/Darwinbots.Desktop.Core.Tests.csproj -c Release
      - name: Test rendered desktop controls
        timeout-minutes: 30
        env:
          DARWINBOTS_GUI_AUDIT_DIR: ${{ github.workspace }}/artifacts/gui-audit/${{ matrix.rid }}
        run: dotnet test modern/desktop/tests/Darwinbots.Desktop.Tests/Darwinbots.Desktop.Tests.csproj -c Release --blame-hang-timeout 10m --blame-hang-dump-type none --logger "trx;LogFileName=rendered-controls.trx" --results-directory artifacts/test-results/${{ matrix.rid }}
      - name: Preserve rendered control receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwinbots-gui-audit-${{ matrix.rid }}
          path: |
            artifacts/gui-audit/${{ matrix.rid }}
            artifacts/test-results/${{ matrix.rid }}
          if-no-files-found: ignore
      - name: Publish desktop package
        run: dotnet publish modern/desktop/src/Darwinbots.Desktop/Darwinbots.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o artifacts/${{ matrix.rid }}
      - name: Smoke test published desktop package
        shell: pwsh
        run: |
          $package = Join-Path $PWD "artifacts/${{ matrix.rid }}"
          $name = if ($env:RUNNER_OS -eq "Windows") { "Darwinbots.Desktop.exe" } else { "Darwinbots.Desktop" }
          $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $package $name))
          $start.ArgumentList.Add("--smoke-test")
          if ($env:RUNNER_OS -eq "Windows") {
            $start.ArgumentList.Add("--native-smoke-fixture")
            $start.ArgumentList.Add((Join-Path $PWD "modern/engine/tests/fixtures/db24832-genuine-movement-cycle1-20261016.sim"))
          }
          $start.WorkingDirectory = $package
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [Diagnostics.Process]::new()
          $process.StartInfo = $start
          try {
            if (!$process.Start()) { throw "Published package did not start." }
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (!$process.WaitForExit(120000)) {
              $process.Kill($true)
              $process.WaitForExit()
              throw "Published package smoke timed out."
            }
            $resultText = $stdout.GetAwaiter().GetResult()
            $errorText = $stderr.GetAwaiter().GetResult()
            Write-Output $resultText
            if ($errorText) { Write-Output $errorText }
            if ($process.ExitCode -ne 0) { throw "Published package smoke exited $($process.ExitCode)." }
            $result = $resultText | ConvertFrom-Json -ErrorAction Stop
            if ($result.status -ne "passed" -or $result.backend -ne "CPU" -or
                $result.movement -ne $true -or $result.save_resume -ne $true -or
                $result.persistent_save_bytes_equal -ne $true -or
                $result.inspection_history_boundary -ne $true -or
                $result.species_settings -ne $true -or $result.bundled_bots -ne 48) {
              throw "Published package did not report every smoke contract."
            }
            if ($env:RUNNER_OS -eq "Windows") {
              $files = $result.native_files
              if ($files.fixture_sha256 -ne "766f386c392c59834a3390a2c726d3e2f8db695fe5b05a932a593d0dccd010e3" -or
                  $files.sim_cycle -ne 2 -or $files.sim_population -ne 1 -or $files.dbo_count -ne 1) {
                throw "Published Windows package did not round-trip the original SIM and DBO."
              }
            }
          } finally {
            $process.Dispose()
          }
      - name: Verify Linux desktop opens its setup window
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xauth x11-utils xvfb
          profile="$(mktemp -d)"
          export XDG_DATA_HOME="$profile/data"
          export XDG_CONFIG_HOME="$profile/config"
          export DARWINBOTS_AUTOSAVE_DIRECTORY="$profile/autosaves"
          export DARWINBOTS_GUI_LOG="$profile/startup.log"
          ulimit -c 0
          timeout --kill-after=5s 45s xvfb-run -a -s '-screen 0 1440x1000x24' bash -euo pipefail <<'BASH'
          cd artifacts/linux-x64
          ./Darwinbots.Desktop >"$DARWINBOTS_GUI_LOG" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            kill -0 "$app_pid" 2>/dev/null || break
            window="$(xwininfo -root -tree | awk '/"Darwinbots Modern .*New World"/ && !found { print $1; found=1 }')"
            if [[ -n "$window" ]] && xwininfo -id "$window" | grep -F 'Map State: IsViewable'; then
              sleep 1
              if kill -0 "$app_pid" 2>/dev/null; then
                echo 'Darwinbots setup window is visible.'
                exit 0
              fi
              break
            fi
            sleep 1
          done
          cat "$DARWINBOTS_GUI_LOG"
          echo 'Darwinbots did not open a usable setup window.' >&2
          exit 1
          BASH
      - uses: actions/upload-artifact@v4
        with:
          name: darwinbots-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
